; manifest.ini
; IBOVmap: a standalone broadcast track map, derived from the Broadcasting app's track map.
[ABOUT]
NAME = IBOVmap
AUTHOR = otherChrisO
VERSION = 0.1.0
DESCRIPTION = Standalone broadcast track map: live car indicators coloured by class or relative to the focused car, sector and corner names, a northpoint, and optional AC Server Manager live-timing classes.

; Loaded when the map is first opened, then kept running so held cars and replay laps stay tracked.
[CORE]
LAZY = PARTIAL

[WINDOW_...]
ID = map
NAME = IBOVmap
FUNCTION_MAIN = windowMap
SIZE = 400, 400
MIN_SIZE = 160, 100
PADDING = 0, 0
FLAGS = FADING, NO_BACKGROUND, NO_SCROLLBAR, NO_SCROLL_WITH_MOUSE, MAIN

[WINDOW_...]
ID = settings
NAME = IBOVmap Settings
FUNCTION_MAIN = windowSettings
SIZE = 620, 740
MIN_SIZE = 500, 420
FLAGS = SETTINGS
